name: CI/CD Pipeline — Vercel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./vitap-eats/package-lock.json"

      - name: Install dependencies
        working-directory: ./vitap-eats
        run: npm ci

      - name: Run ESLint
        working-directory: ./vitap-eats
        run: npm run lint

  # NOTE: Build & deployment is handled automatically by Vercel's GitHub integration.
  # Vercel has the real Firebase env vars configured and builds on every push to main.
  # Monitor deployments at: https://vercel.com/dashboard
