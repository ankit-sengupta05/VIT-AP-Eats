name: CI/CD Pipeline — Vercel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./vitap-eats/package-lock.json"

      - name: Install dependencies
        working-directory: ./vitap-eats
        run: npm ci

      - name: Run ESLint
        working-directory: ./vitap-eats
        run: npm run lint

      - name: Security Audit
        working-directory: ./vitap-eats
        run: npm run audit-ci

  deploy:
    name: Deploy to Vercel
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./vitap-eats
          vercel-args: "--prod"
