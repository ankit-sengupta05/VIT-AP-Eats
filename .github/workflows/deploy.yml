name: CI/CD Pipeline — Vercel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./vitap-eats/package-lock.json"

      - name: Install dependencies
        working-directory: ./vitap-eats
        run: npm ci

      - name: Run ESLint
        working-directory: ./vitap-eats
        run: npm run lint

  # NOTE: This project deploys through Vercel only.
  # There is no separate Cloudflare worker build step in this workflow.
  # Vercel handles the production build and deployment from main.
