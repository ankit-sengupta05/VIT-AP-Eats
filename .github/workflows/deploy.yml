name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./vitap-eats/package-lock.json"

      - name: Install dependencies (Frontend)
        working-directory: ./vitap-eats
        run: npm ci

      - name: Run ESLint
        working-directory: ./vitap-eats
        run: npm run lint

      - name: Security Audit
        working-directory: ./vitap-eats
        run: npm run audit-ci

  deploy-backend:
    name: Deploy API to Cloudflare Workers
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./backend
          command: deploy

  # Note: the frontend (vitap-eats) is deployed automatically by Cloudflare's
  # own Git integration for the "vit-ap-eats" Workers project on every push
  # to main — no separate GitHub Actions deploy step needed here. There used
  # to be a `deploy-frontend` job using `cloudflare/pages-action@v1`, but
  # that targeted a legacy Cloudflare Pages project that no longer exists
  # now that this app deploys via Cloudflare Workers + OpenNext instead.
