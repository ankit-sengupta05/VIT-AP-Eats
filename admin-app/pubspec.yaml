name: vitap_eats_admin
description: VIT-AP Eats — Admin Panel for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5
  firebase_messaging: ^14.7.19
  firebase_storage: ^11.6.9

  # Local Notifications (foreground FCM)
  flutter_local_notifications: ^17.0.0

  # Charts
  fl_chart: ^0.68.0

  # State management
  provider: ^6.1.2

  # Fonts & icons
  google_fonts: ^6.2.1

  # Image loading
  cached_network_image: ^3.3.1

  # Date/number formatting
  intl: ^0.19.0

  # URL launcher (WhatsApp)
  url_launcher: ^6.2.5

  # Image picker (for menu items)
  image_picker: ^1.0.7

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Badges
  badges: ^3.1.2

  # Animations
  animate_do: ^3.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
